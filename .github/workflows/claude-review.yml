name: Claude Review

# Auto-review every PR opened or pushed. Distinct from .github/workflows/evals.yml:
# the eval gate runs deterministic scorers against the lastmile order tool; this
# one is general code-quality review across the whole diff.
#
# Required secret: ANTHROPIC_API_KEY (already set on this repo).
#
# Fork PRs are skipped because GitHub blocks secret access from forks by design.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # Required by anthropics/claude-code-action@v1 even when using the
  # direct Anthropic API (action uses GitHub OIDC for its internal token
  # exchange; missing this fails with "Could not fetch an OIDC token").
  id-token: write

jobs:
  review:
    name: Claude code review
    runs-on: ubuntu-latest
    # Skip PRs from forks — they can't access ANTHROPIC_API_KEY anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # 20, not 10: a large PR (the agent door, F28) ran out of time mid-review twice at 10.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The action refuses to review a PR that modifies its own workflow file
      # (security: a PR shouldn't be able to disarm its own reviewer). When that
      # happens, the action exits 1 with "Workflow validation failed". Detect
      # the case ourselves and skip the action step so CI stays green — those
      # PRs are reviewed manually anyway.
      - name: Detect self-modification of review workflow
        id: self_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' \
              | grep -qx '.github/workflows/claude-review.yml'; then
            echo "self_modified=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR modifies .github/workflows/claude-review.yml — skipping Claude review (action refuses to run on PRs that edit it)."
          else
            echo "self_modified=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.self_check.outputs.self_modified != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR. Focus narrowly on:
              - Correctness bugs / edge cases in changed code
              - Security (Clerk auth, Quiqup tokens, real-API side effects)
              - Tool description quality if lib/tools/ changed

            Post a short top-level summary plus inline comments only on
            issues that would actually break or surprise. Skip nits.
            CLAUDE.md / AGENTS.md and docs/quiqup-api/ have the project
            conventions and Quiqup API canonical reference.
          # --max-turns bumped from 30 after a real PR hit the cap mid-review
          # (anthropics/claude-code-action#1177 confirmed the flag is honored).
          # --allowedTools mirrors the official pr-review-comprehensive.yml
          # example so turns are spent on review actions, not broad
          # exploration of the full MCP/Bash surface.
          # The "directory mismatch for tsconfig.json, fd 4" line in logs is a
          # harmless Bun 1.3.6 bug (anthropics/claude-code-action#1246) — ignore.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-6
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
